# Every change: run all tests, then update the game server (Supabase) and the app (GitHub Pages).
# Nothing is published if a test fails.
name: Testy i publikacja

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  serwer:
    needs: testy
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: dvlskflotmovgkspnarq
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdzenie sekretów
        env:
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
          TABLE_CODE: ${{ secrets.TABLE_CODE }}
        run: |
          brak=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && brak="$brak SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && brak="$brak SUPABASE_DB_PASSWORD"
          [ -z "$ADMIN_PIN" ] && brak="$brak ADMIN_PIN"
          [ -z "$TABLE_CODE" ] && brak="$brak TABLE_CODE"
          if [ -n "$brak" ]; then echo "::error::Brakuje sekretów na GitHubie:$brak"; exit 1; fi
          echo "Wszystkie sekrety są ustawione."
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Połącz z projektem
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Baza danych
        run: supabase db push --include-all
      - name: PIN właściciela i kod stołu
        run: supabase secrets set ADMIN_PIN="${{ secrets.ADMIN_PIN }}" TABLE_CODE="${{ secrets.TABLE_CODE }}" --project-ref "$PROJECT_REF"
      - name: Serwer gry
        run: supabase functions deploy game --project-ref "$PROJECT_REF"

  aplikacja:
    needs: serwer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
